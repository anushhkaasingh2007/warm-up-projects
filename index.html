<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cyber Background Layer -->
    <div class="bg-overlay"></div>

    <!-- Main Glass Card -->
    <div class="card-container">
        <!-- Holographic Photo Ring -->
        <div class="avatar-ring">
            <img src="photo.jpg" alt="Profile Photo" class="profile-img">
        </div>
        
        <!-- Profile Info -->
        <h2 class="name">Anushka Singh</h2>
        <p class="role">Frontend Developer & AI Solutions Architect</p>
        <p class="bio">Innovating at the intersection of performant web architectures and predictive AI systems.</p>

        <!-- Tech Skill Chips -->
        <div class="skills">
            <span class="tag">JavaScript <small>[95%]</small></span>
            <span class="tag">CSS <small>[90%]</small></span>
            <span class="tag">HTML <small>[98%]</small></span>
            <span class="tag">AI Integration <small>[85%]</small></span>
            <span class="tag">React <small>[92%]</small></span>
        </div>

        <!-- GitHub Button -->
        <a href="https://github.com/anushhkaasingh2007" target="_blank" class="github-btn">
            View GitHub Profile
        </a>
    </div>

</body>
</html>
